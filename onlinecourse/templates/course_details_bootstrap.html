<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ course.name }} - Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="text-primary mb-4">{{ course.name }}</h1>
        <p class="lead text-muted">{{ course.description }}</p>
        
        <div class="card shadow-sm mt-4">
            <div class="card-header bg-secondary text-white">
                <h3>Course Lessons</h3>
            </div>
            <ul class="list-group list-group-flush">
                {% for lesson in course.lesson_set.all %}
                    <li class="list-group-item py-3">
                        <h5>{{ forloop.counter }}. {{ lesson.title }}</h5>
                        <p class="mb-0 text-muted">{{ lesson.content }}</p>
                    </li>
                {% empty %}
                    <li class="list-group-item text-muted">No lessons available.</li>
                {% endfor %}
            </ul>
        </div>
        <div class="mt-4">
            <a href="{% url 'onlinecourse:index' %}" class="btn btn-outline-primary">&larr; Back to Home</a>
        </div>
    </div>
</body>
</html>
